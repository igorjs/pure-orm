# SPDX-License-Identifier: Apache-2.0
#
# Edge-runtime safety: fails on Node-only imports in code that ships to
# Cloudflare Workers / Vercel Edge / Deno Deploy. Owned by this repo
# (NOT templated from repo-config) because the watched-path set is
# pure-orm-specific.

name: Edge safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-edge-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Edge-runtime import scan
        run: node scripts/check-edge-safe.mjs

      - name: Internal-import alias scan
        run: node scripts/check-imports.mjs
