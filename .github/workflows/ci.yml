name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm run lint

      - name: Type-check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

      - name: Type tests
        run: pnpm run test:types

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  integration-sqlite:
    needs: lint-and-test
    runs-on: ubuntu-latest
    name: integration / sqlite
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SQLite integration tests
        run: node --experimental-strip-types --no-warnings tests/integration/sqlite.test.ts

  integration-pg:
    needs: lint-and-test
    runs-on: ubuntu-latest
    name: integration / postgresql
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pure_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL integration tests
        run: node --experimental-strip-types --no-warnings tests/integration/pg.test.ts
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: pure_orm_test
          PG_USER: postgres
          PG_PASSWORD: postgres

  smoke-node:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "25"]
    name: smoke / node-${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Runtime smoke test
        run: node tests/runtime-smoke.mjs

  smoke-deno:
    needs: lint-and-test
    runs-on: ubuntu-latest
    name: smoke / deno
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install peer dependency
        run: |
          echo '{"dependencies":{"@igorjs/pure-fx":"0.1.0"}}' > /tmp/deno-deps.json
          cd /tmp && cp deno-deps.json package.json && deno install --node-modules-dir
          cp -r /tmp/node_modules ./node_modules

      - name: Runtime smoke test
        run: deno run --allow-all --node-modules-dir tests/runtime-smoke.mjs

  smoke-bun:
    needs: lint-and-test
    runs-on: ubuntu-latest
    name: smoke / bun
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install peer dependency
        run: |
          echo '{"dependencies":{"@igorjs/pure-fx":"0.1.0"}}' > /tmp/bun-deps.json
          cd /tmp && cp bun-deps.json package.json && bun install
          cp -r /tmp/node_modules ./node_modules

      - name: Runtime smoke test
        run: bun tests/runtime-smoke.mjs
